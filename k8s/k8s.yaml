apiVersion: v1
kind: Secret
metadata:
  name: wspeedrun
stringData:
  DATABASE_URL: "mysql://WY:WY123456!@2902697845-fs.mysql.database.azure.com/2902697845-db?sslaccept=accept-invalid-certificates"
  DATABASE_HOST: "2902697845-fs.database.azure.com"
  DATABASE_USER: "WY"
  DATABASE_PASSWORD: "WY123456!"
  DATABASE_NAME: "2902697845-db"
  JWT_SECRET: "bebas"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
  labels:
    app: backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - name: backend
        image: 2902697845.azurecr.io/backend:v1
        ports:
        - containerPort: 3000
        envFrom:
        - secretRef:
          name: wspeedrun
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-deployment
  labels:
    app: frontend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: frontend
        image: 2902697845.azurecr.io/frontend:v1
        ports:
        - containerPort: 80
---
kind: Service
apiVersion: v1
metadata:
  name: backend
spec:
  selector:
    app: backend
  ports:
  - protocol: TCP
    port: 3000
    targetPort: 3000
---
kind: Service
apiVersion: v1
metadata:
  name: frontend
spec:
  selector:
    app: frontend
  ports:
  - protocol: TCP
    port: 80
    targetPort: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: minimal-ingress
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /$2

spec:
  ingressClassName: webapprouting.kubernetes.azure.com
  rules:
  - http:
      paths:
      - path: /()(.*)
        pathType: ImplementationSpecific
        backend:
          service:
            name: frontend
            port:
              number: 80
  - http:
      paths:
      - path: /api(./|*)(.*)
        pathType: ImplementationSpecific
        backend:
          service:
            name: backend
            port:
              number: 3000