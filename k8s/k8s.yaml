apiVersion: v1
kind: Secret
metadata:
  name: wspeedrun
type: Opaque
stringData:
  DATABASE_URL: "mysql://WY:WY123456%21@2902697845-db.mysql.database.azure.com:3306/wspeedrun?sslaccept=accept_invalid_certs"
  DATABASE_HOST: "2902697845-db.mysql.database.azure.com"
  DATABASE_USER: "WY"
  DATABASE_PASSWORD: "WY123456!"
  DATABASE_NAME: "wspeedrun"
  JWT_SECRET: "bebas"
---
# Creates the tables and seed data in MySQL (runs once, inside the VNet)
apiVersion: batch/v1
kind: Job
metadata:
  name: db-migrate
spec:
  backoffLimit: 4
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: migrate
        image: 2902697845acr.azurecr.io/backend:v1
        command: ["sh", "-c", "npx prisma migrate deploy && npx prisma db seed"]
        envFrom:
        - secretRef:
            name: wspeedrun
---
kind: Service
apiVersion: v1
metadata:
  name: backend
spec:
  type: ClusterIP
  selector:
    app: backend
  ports:
  - protocol: TCP
    port: 3000
    targetPort: 3000
---
kind: Service
apiVersion: v1
metadata:
  name: frontend
spec:
  type: ClusterIP
  selector:
    app: frontend
  ports:
  - protocol: TCP
    port: 80
    targetPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
  labels:
    app: backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - name: backend
        image: 2902697845acr.azurecr.io/backend:v1
        ports:
        - containerPort: 3000
        envFrom:
        - secretRef:
            name: wspeedrun
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-deployment
  labels:
    app: frontend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: frontend
        image: 2902697845acr.azurecr.io/frontend:v1
        ports:
        - containerPort: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: wspeedrun-ingress
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /$2
spec:
  ingressClassName: webapprouting.kubernetes.azure.com
  rules:
  - http:
      paths:
      - path: /api(/|$)(.*)
        pathType: ImplementationSpecific
        backend:
          service:
            name: backend
            port:
              number: 3000
      - path: /()(.*)
        pathType: ImplementationSpecific
        backend:
          service:
            name: frontend
            port:
              number: 80
